name: CI

on:
  push:
    branches: [main, static-lake]
  pull_request:
    branches: [main, static-lake]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install duckdb pyarrow orjson ijson zstandard pytest frictionless polars pandas

      - name: Cache test fixtures
        uses: actions/cache@v4
        with:
          path: tests/fixtures/diverse.json.gz
          key: fixtures-default-v1

      - name: Fetch test fixtures (if not cached)
        run: |
          if [ ! -f tests/fixtures/diverse.json.gz ]; then
            python tests/fetch_fixtures.py --scale default
          fi

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Check all scripts compile
        run: |
          for f in bin/*.py benchmarks/*.py uniprot_parquet.py; do
            python -m py_compile "$f"
          done

  nextflow:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Nextflow
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/
          nextflow -version

      - name: Lint pipeline
        run: nextflow lint upjson2lake.nf nextflow.config

      # Strict-parser check of the pipeline + config under every profile
      # (catches .nf/.config syntax errors without executing anything).
      - name: Resolve config per profile
        run: |
          for p in local short prod; do
            nextflow config -profile "$p" upjson2lake.nf > /dev/null
          done
