[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "uniprot-parquet"
version = "0.1.0"
description = "DuckDB client and macros for the UniProtKB Parquet data lake"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [
    { name = "Daniel Rice" }
]
dependencies = [
    "duckdb>=1.5,<2"
]

[project.urls]
Homepage = "https://github.com/ebi-uniprot/uniprot-parquet"
Repository = "https://github.com/ebi-uniprot/uniprot-parquet.git"

[tool.setuptools]
py-modules = ["uniprot_parquet"]
